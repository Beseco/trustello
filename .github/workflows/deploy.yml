name: Deploy to Production

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            set -e
            cd /opt/trustello

            echo "=== Pulling latest code ==="
            git pull origin main

            echo "=== Ensuring deploy/.env symlink ==="
            ln -sf /opt/trustello/.env.production /opt/trustello/deploy/.env

            echo "=== Building Docker image ==="
            docker compose -f deploy/docker-compose.prod.yml build app

            echo "=== Running migrations ==="
            docker compose -f deploy/docker-compose.prod.yml run --rm \
              --entrypoint "npx prisma migrate deploy" app

            echo "=== Restarting app ==="
            docker compose -f deploy/docker-compose.prod.yml up -d app

            echo "=== Health check ==="
            sleep 5
            curl -sf http://localhost:3000/api/health | grep '"ok":true'

            echo "=== Deploy complete ==="
