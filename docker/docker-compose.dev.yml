services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: trustello_dev
      POSTGRES_USER: trustello
      POSTGRES_PASSWORD: trustello_dev_pw
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  clamav:
    image: clamav/clamav:stable
    platform: linux/amd64
    ports:
      - "3310:3310"

  mailpit:
    image: axllent/mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_MAX_MESSAGES: 5000

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: trustello
      MINIO_ROOT_PASSWORD: trustello_dev_pw
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 5

  createbuckets:
    image: minio/minio
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 trustello trustello_dev_pw &&
        mc mb --ignore-existing local/trustello-dev &&
        echo 'Bucket trustello-dev ready.'
      "

volumes:
  pgdata:
  miniodata:
