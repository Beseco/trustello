server {
    listen 80;
    server_name addin.trustello.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name addin.trustello.de;

    ssl_certificate     /etc/letsencrypt/live/addin.trustello.de/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/addin.trustello.de/privkey.pem;

    # Office.js verlangt HTTPS + korrekte Security-Header
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # X-Frame-Options NICHT setzen — Office.js lädt das Add-in in einem iframe
    # add_header X-Frame-Options "DENY" always;  # <-- darf nicht gesetzt werden!

    # Content-Security-Policy für Office Add-ins:
    # office.js muss von appsforoffice.microsoft.com geladen werden dürfen
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://appsforoffice.microsoft.com; style-src 'self' 'unsafe-inline'; connect-src 'self' https://app.trustello.de; img-src 'self' data:; frame-ancestors https://outlook.live.com https://outlook.office.com https://outlook.office365.com;" always;

    root /opt/trustello/addin/dist;
    index taskpane.html;

    # Statische Assets mit Cache
    location ~* \.(js|css|png|svg|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Alle anderen Routen → taskpane.html (SPA)
    location / {
        try_files $uri $uri/ /taskpane.html;
    }
}
